plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_id }

// Forge 서버 실패 시 (CI 가 USE_FORGE_MIRROR=1 로 다시 빌드): ForgeGradle 이 넣는 Forge 저장소 주소까지 전부 CreeperHost 미러로 바꿈
if (System.getenv('USE_FORGE_MIRROR')) {
    def toMirror = { r -> if (r instanceof MavenArtifactRepository && r.url.toString().contains('maven.minecraftforge.net')) r.url = 'https://maven.creeperhost.net/' }
    repositories.all(toMirror)
    buildscript.repositories.all(toMirror)
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client { property 'forge.enabledGameTestNamespaces', mod_id }
        server { property 'forge.enabledGameTestNamespaces', mod_id; args '--nogui' }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()   // 일반 라이브러리는 Maven Central 먼저 (Forge 서버가 느릴 때 대비)
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.7.4")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title": mod_id, "Specification-Vendor": mod_authors, "Specification-Version": "1",
                    "Implementation-Title": project.name, "Implementation-Version": project.jar.archiveVersion,
                    "Implementation-Vendor": mod_authors])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
