name: inspect-epicfight
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: |
          curl -sL -o ef.jar https://cdn.modrinth.com/data/vu3NZ5Ma/versions/KEBfkBat/epic-fight-20.14.17-mc1.20.1-forge.jar
          javap -p -cp ef.jar yesman.epicfight.config.ClientConfig | grep -v -E "ForgeConfigSpec|lambda" | sed 's/yesman.epicfight.//g;s/java.util.//g;s/net.minecraft.//g' > out.txt || true
          unzip -l ef.jar | grep -i -E "TargetIndicator|Outline|EntityGuide|TargetGuide" | awk '{print $4}' | head -20 >> out.txt || true
          split -l 25 out.txt part_
          for f in part_*; do msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' $f); echo "::notice title=$f::$msg"; done
