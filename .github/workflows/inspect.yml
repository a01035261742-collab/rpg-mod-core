name: inspect-epicfight
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: |
          curl -sL -o ef.jar https://cdn.modrinth.com/data/vu3NZ5Ma/versions/KEBfkBat/epic-fight-20.14.17-mc1.20.1-forge.jar
          javap -p -cp ef.jar yesman.epicfight.config.ClientConfig > out.txt || true
          javap -p -cp ef.jar yesman.epicfight.config.EpicFightOptions >> out.txt 2>&1 || true
          unzip -l ef.jar | grep -i -E "config/|TargetIndicator|Outline|Highlight" | head -40 >> out.txt || true
          cat out.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' out.txt | head -c 60000)
          echo "::notice title=ef::$msg"
