name: inspect-epicfight
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: |
          curl -sL -o ef.jar https://cdn.modrinth.com/data/vu3NZ5Ma/versions/KEBfkBat/epic-fight-20.14.17-mc1.20.1-forge.jar
          # PlayerPatch 모드 관련 메서드
          javap -p -cp ef.jar yesman.epicfight.world.capabilities.entitypatch.player.PlayerPatch yesman.epicfight.world.capabilities.entitypatch.player.ServerPlayerPatch > all.txt
          grep -i "mode" all.txt | tr '\n' ' ' > out.txt
          wc -l all.txt >> out.txt
          cat out.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' out.txt | head -c 60000)
          echo "::notice title=ef::$msg"
