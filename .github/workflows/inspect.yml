name: inspect-epicfight
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: |
          curl -sL -o ef.jar https://cdn.modrinth.com/data/vu3NZ5Ma/versions/KEBfkBat/epic-fight-20.14.17-mc1.20.1-forge.jar
          for C in AttackAnimation StaticAnimation DynamicAnimation ActionAnimation MainFrameAnimation; do
            echo "== $C" >> out.txt
            javap -p -cp ef.jar yesman.epicfight.api.animation.types.$C | grep -E "getPlaySpeed|addProperty|PlaySpeed" >> out.txt || true
          done
          javap -p -c -cp ef.jar yesman.epicfight.api.animation.types.AttackAnimation | awk '/ float getPlaySpeed\(/{f=1} f{print} f&&/^$/{exit}' | grep -E "getstatic|invoke|Method|Field|fconst|ldc|areturn|freturn" | head -60 >> out.txt || true
          echo "== Static getPlaySpeed" >> out.txt
          javap -p -c -cp ef.jar yesman.epicfight.api.animation.types.StaticAnimation | awk '/ float getPlaySpeed\(/{f=1} f{print} f&&/^$/{exit}' | grep -E "getstatic|invoke|Field|freturn" | head -30 >> out.txt || true
          cat out.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' out.txt | head -c 60000)
          echo "::notice title=ef::$msg"
