name: inspect-epicfight
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: |
          curl -sL -o ef.jar https://cdn.modrinth.com/data/vu3NZ5Ma/versions/KEBfkBat/epic-fight-20.14.17-mc1.20.1-forge.jar
          javap -cp ef.jar yesman.epicfight.gameasset.Animations | grep -o -E "[A-Z_0-9]*(SPEAR|STAFF|MAGIC|CAST|TRIDENT|POKE|STAB|THRUST)[A-Z_0-9]*" | sort -u > out.txt || true
          split -l 40 out.txt part_
          for f in part_*; do msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' $f); echo "::notice title=$f::$msg"; done
