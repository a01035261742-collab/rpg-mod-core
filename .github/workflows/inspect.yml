name: inspect-epicfight
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: |
          curl -sL -o gl.jar https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/software/bernie/geckolib/geckolib-forge-1.20.1/4.7.4/geckolib-forge-1.20.1-4.7.4.jar
          ls -la gl.jar
          javap -cp gl.jar software.bernie.geckolib.animatable.GeoEntity software.bernie.geckolib.core.animatable.GeoAnimatable software.bernie.geckolib.core.animation.AnimationController | grep -i -E "trigger|stop|interface|class" > out.txt || true
          split -l 25 out.txt part_
          for f in part_*; do msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' $f); echo "::notice title=$f::$msg"; done
