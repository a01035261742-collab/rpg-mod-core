name: inspect-epicfight
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: |
          curl -sL -o ef.jar https://cdn.modrinth.com/data/vu3NZ5Ma/versions/KEBfkBat/epic-fight-20.14.17-mc1.20.1-forge.jar
          unzip -l ef.jar | grep -E "animation/types/(AttackAnimation|StaticAnimation|ActionAnimation|DynamicAnimation|MainFrameAnimation)" > out.txt || true
          javap -p -cp ef.jar yesman.epicfight.gameasset.Animations | grep -E "STEEL_WHIRLWIND|GREATSWORD" >> out.txt || true
          javap -p -c -cp ef.jar yesman.epicfight.api.animation.types.AttackAnimation | sed -n '/getPlaySpeed/,/^$/p' | head -80 >> out.txt || true
          javap -p -cp ef.jar yesman.epicfight.api.animation.types.StaticAnimation | grep -E "addProperty|getPlaySpeed|getProperty" >> out.txt || true
          javap -p -cp ef.jar yesman.epicfight.api.animation.types.DynamicAnimation | grep -E "getPlaySpeed|Property" >> out.txt || true
          javap -p -c -cp ef.jar yesman.epicfight.api.animation.types.StaticAnimation | sed -n '/public .*getPlaySpeed/,/^$/p' | head -60 >> out.txt || true
          cat out.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' out.txt | head -c 60000)
          echo "::notice title=ef::$msg"
