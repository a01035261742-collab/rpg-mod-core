name: mc-inspect
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: |
          chmod +x gradlew
          ./gradlew compileJava -q || true
          find ~/.gradle -name "*.jar" | grep -i -E "recomp|mapped_official|forge-1.20.1.*(client|joined)" | head -20 > jars.txt
          cat jars.txt
          J=$(grep minecraft_user_repo jars.txt | head -1)
          echo "JAR=$J"
          mkdir out
          for c in net.minecraft.server.level.ThreadedLevelLightEngine net.minecraft.world.level.lighting.LevelLightEngine net.minecraft.world.level.lighting.LightEngine net.minecraft.world.level.lighting.SkyLightEngine net.minecraft.world.level.lighting.ChunkSkyLightSources net.minecraft.world.level.chunk.ChunkAccess net.minecraft.world.level.chunk.LevelChunk net.minecraft.world.level.lighting.LayerLightSectionStorage net.minecraft.world.level.lighting.SkyLightSectionStorage; do
            javap -p -cp "$J" $c > out/$c.txt 2>&1 || true
          done
          javap -p -c -cp "$J" net.minecraft.world.level.chunk.storage.ChunkSerializer > out/ChunkSerializer_c.txt 2>&1 || true
          javap -p -c -cp "$J" net.minecraft.server.level.ThreadedLevelLightEngine > out/TLLE_c.txt 2>&1 || true
          javap -p -c -cp "$J" net.minecraft.world.level.lighting.SkyLightEngine > out/Sky_c.txt 2>&1 || true
          javap -p -c -cp "$J" net.minecraft.world.level.lighting.LightEngine > out/LE_c.txt 2>&1 || true
      - run: |
          set +e
          cd out
          head -3 *.txt
          {
          echo "== CSLS"; grep -E "(public|protected|private).*\(" net.minecraft.world.level.lighting.ChunkSkyLightSources.txt
          echo "== ChunkAccess"; grep -iE "light|sky" net.minecraft.world.level.chunk.ChunkAccess.txt
          echo "== LevelChunk"; grep -iE "light|sky" net.minecraft.world.level.chunk.LevelChunk.txt
          echo "== LLE"; grep -E "\(" net.minecraft.world.level.lighting.LevelLightEngine.txt
          echo "== TLLE"; grep -E "\(" net.minecraft.server.level.ThreadedLevelLightEngine.txt
          echo "== LE"; grep -E "\(" net.minecraft.world.level.lighting.LightEngine.txt
          echo "== SKY"; grep -E "\(" net.minecraft.world.level.lighting.SkyLightEngine.txt
          echo "== LLSS"; grep -E "\(" net.minecraft.world.level.lighting.LayerLightSectionStorage.txt
          } > sum.txt
          grep -n "isLightOn" ChunkSerializer_c.txt | head > ser.txt
          L=$(grep -n "isLightOn" ChunkSerializer_c.txt | head -1 | cut -d: -f1); sed -n "$((L-5)),$((L+60))p" ChunkSerializer_c.txt >> ser.txt
          echo "@@@BEGIN"; cat sum.txt ser.txt; echo "@@@END"
          echo "@@@SKYC"; grep -n -A40 "propagateLightSources\|checkNode" Sky_c.txt | head -200; echo "@@@END2"
