name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -A4 -E "\.java:[0-9]+: error" build.log | head -150 > err.txt || true
          [ -s err.txt ] || grep -B2 -A25 "What went wrong" build.log | head -80 > err.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' err.txt)
          echo "::error title=build::$msg"
      - name: Publish jar to build branch
        if: success()
        run: |
          mkdir -p /tmp/out && cp build/libs/*.jar /tmp/out/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan build-output
          git rm -rf . -q
          cp /tmp/out/*.jar .
          git add *.jar
          git commit -m "build ${GITHUB_SHA}"
          git push -f origin build-output
