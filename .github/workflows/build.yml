name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -A4 -E "\.java:[0-9]+: error" build.log | head -80 > err.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' err.txt)
          echo "::error title=build::$msg"
      - name: Inspect API
        if: failure()
        run: |
          J=$(find ~/.gradle/caches -name "minecraft-*client*.jar" -o -name "minecraft-merged*.jar" -o -name "minecraft-clientOnly*.jar" | grep -v sources | head -1)
          echo "JAR=$J"
          [ -z "$J" ] && J=$(find ~/.gradle/caches ~/.gradle -path "*fabric-loom*" -name "*.jar" | grep -i minecraft | grep -v sources | head -1)
          echo "JAR=$J" > api.txt
          javap -cp "$J" net.minecraft.client.Minecraft | grep -iE "screen|getConnection|player|gui" >> api.txt 2>&1 || true
          javap -cp "$J" net.minecraft.client.KeyMapping | grep -iE "key|default|set" >> api.txt 2>&1 || true
          grep -vE "KEY_[A-Z0-9_]+;$" api.txt | head -150 > api2.txt
          grep -E "KEY_(Q|E|R|F|I|Z|X);" api.txt >> api2.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' api2.txt)
          echo "::error title=api::$msg"
      - name: Publish jar to build branch
        if: success()
        run: |
          mkdir -p /tmp/out && cp build/libs/*.jar /tmp/out/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan build-output
          git rm -rf . -q
          cp /tmp/out/*.jar .
          git add *.jar
          git commit -m "build ${GITHUB_SHA}"
          git push -f origin build-output
