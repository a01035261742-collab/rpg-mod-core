name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -A4 -E "\.java:[0-9]+: error" build.log | head -150 > err.txt || true
          [ -s err.txt ] || grep -B2 -A25 "What went wrong" build.log | head -80 > err.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' err.txt)
          echo "::error title=build::$msg"
      # 런처 배포는 커밋 메시지에 [release] 가 있을 때나 수동 실행 때만 (평소 push 는 build-output 에 jar 만)
      - name: Release + manifest (launcher auto-update)
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          JAR=$(ls build/libs/*.jar | grep -v -e sources -e slim | head -1)
          python3 ci/make_manifest.py "$JAR" > /tmp/manifest.json
          cat /tmp/manifest.json
          # 업데이트 기록: 이전 릴리스 changelog.json + ci/changelog.json + 이번 커밋들의 "player: ..." 줄
          git fetch --tags -q || true
          PREV=$(git tag --sort=-v:refname | grep -v "^v$VER$" | head -1)
          if [ -n "$PREV" ]; then git log --format=%B "$PREV..HEAD" > /tmp/msgs.txt; else git log -1 --format=%B > /tmp/msgs.txt; fi
          gh release download --pattern changelog.json --dir /tmp/prev 2>/dev/null || true
          python3 ci/make_changelog.py "$VER" /tmp/prev/changelog.json /tmp/msgs.txt > /tmp/changelog.json
          cat /tmp/changelog.json
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" "$JAR" /tmp/manifest.json /tmp/changelog.json --clobber
          else
            gh release create "v$VER" "$JAR" /tmp/manifest.json /tmp/changelog.json --title "v$VER" --notes "자동 빌드 ${GITHUB_SHA}" --target "$GITHUB_SHA" --latest
          fi
      - name: Publish jar to build branch
        if: success()
        run: |
          mkdir -p /tmp/out && cp build/libs/*.jar /tmp/out/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan build-output
          git rm -rf . -q
          cp /tmp/out/*.jar .
          git add *.jar
          git commit -m "build ${GITHUB_SHA}"
          git push -f origin build-output
